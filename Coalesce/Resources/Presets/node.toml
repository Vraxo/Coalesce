# Node.js project preset for Coalesce.

output = "coalesce.md"

sources = [
  "./src"
]

include_extensions = [
  ".js",
  ".jsx",
  ".ts",
  ".tsx",
  ".json",
  ".html",
  ".css",
  ".scss",
  ".md",
  ".txt"
]

exclude_dirs = [
  "node_modules",
  "dist",
  "build",
  ".cache"
]

exclude_files = [
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml"
]
