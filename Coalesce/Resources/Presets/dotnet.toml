# .NET project preset for Coalesce.

output = "coalesce.md"

sources = [
  "./src"
]

include_extensions = [
  ".cs",
  ".csproj",
  ".slnx",
  ".sln",
  ".props",
  ".json",
  ".toml",
  ".xml",
  ".md",
  ".txt"
]

exclude_dirs = [
  "bin",
  "obj",
  ".vs",
  "artifacts",
  "packages"
]

exclude_files = []
